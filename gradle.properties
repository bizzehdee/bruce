# Memory caps: an uncapped build (daemon, Kotlin daemon, one worker and one native compile
# per core) exhausted a 31 GB workstation on 2026-09-27 (.learnings/build-memory-limits.md).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.workers.max=8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Public OAuth client ID of Bruce's Hugging Face app. Not a secret: it appears in every
# sign-in URL. The app has no client secret (.learnings/hf-oauth-for-native-apps.md).
bruce.huggingFaceClientId=f702d81d-7b00-4ae1-9a39-8304fff2b9c5
